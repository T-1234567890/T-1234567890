<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About - 1234567890.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="/js/react-app.css" />
    <link rel="stylesheet" href="/js/pixel-blast-background.css" />
  </head>
  <body class="subpage pixel-blast-page">
    <div class="bg" aria-hidden="true"></div>
    <div id="page-pixel-blast" class="page-pixel-blast" aria-hidden="true"></div>

    <header class="topbar">
      <nav class="nav" aria-label="Primary">
        <a class="nav__logo" href="/" aria-label="Home">
          <img src="../assets/icon2.png" alt="" width="28" height="28" />
        </a>

        <div class="nav__center">
          <a class="nav__link" href="/about/" aria-current="page" data-i18n="nav_about">About</a>
          <a class="nav__link" href="/blog/" data-i18n="nav_blog">Blog</a>
          <a class="nav__link" href="/projects/" data-i18n="nav_projects">Projects</a>
        </div>

        <button class="nav__lang" type="button" aria-pressed="false">中文</button>
      </nav>
    </header>

    <div class="nav-trigger" id="nav-trigger" aria-hidden="true"></div>

    <main class="page">
      <div class="page-shell">
        <section class="page-header">
          <p class="eyebrow"></p>
          <h1 class="page-title" data-i18n="about_me_title">About Me</h1>
          <p class="page-lede">
            <span data-i18n="about_me_line1">A Human.</span> <br>
            <span data-i18n="about_me_line2">An IB Student.</span>
          </p>
        </section>

        <div
          class="about-dashboard-mount"
          id="about-dashboard"
          aria-label="Your local time, rotating quote, and technology stack"
        ></div>
      </div>
    </main>

    <footer class="footer reveal" id="siteFooter">
      <div class="footer__inner footer__inner--simple">
        <div class="footer__line" data-i18n="footer_line1">
          © 2026 Tony Hu. All rights reserved.
        </div>
        <div class="footer__tiny" data-i18n="footer_line2">
          This website uses cookies for basic functionality and analytics.
        </div>
        <div class="footer__line">
          <a class="footer__link" href="/privacy/" data-i18n="footer_privacy">Privacy Policy</a>
          <span class="footer__separator" aria-hidden="true">·</span>
          <a class="footer__link" href="/legal-notices/" data-i18n="footer_legal_notices">Legal Notices</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/js/react-app.js"></script>
    <script type="module" src="/js/pixel-blast-background.js"></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
